<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BaseLead</title>
<style>
  html,body{margin:0;height:100%;background:#050505;color:#fff;font-family:-apple-system,system-ui,sans-serif}
  main{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box}
  h1{font-size:22px;margin:16px 0 6px} p{color:#9ca3af;margin:0 0 20px;max-width:280px;line-height:1.5}
  button{background:#3B82F6;color:#fff;border:0;border-radius:12px;padding:12px 22px;font-weight:600;font-size:16px}
  .logo{font-weight:800;font-size:28px;letter-spacing:-.02em}.logo span{color:#3B82F6}
</style>
</head>
<body>
<main>
  <div class="logo">Base<span>Lead</span></div>
  <h1>You're offline</h1>
  <p>BaseLead needs an internet connection. Check your Wi-Fi or data and try again.</p>
  <button onclick="location.reload()">Try again</button>
</main>
</body>
</html>
