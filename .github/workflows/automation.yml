# Free 24/7 automation: runs follow-ups, reply detection and reminders every 15 minutes.
# Vercel's free plan only allows a once-a-day cron, so GitHub runs it instead (free).
# Setup (once): GitHub repo → Settings → Secrets and variables → Actions → New repository secret
#   APP_URL      = https://your-domain (no trailing slash)
#   CRON_SECRET  = the same CRON_SECRET as in Vercel
name: BaseLead automation

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run automation
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL or CRON_SECRET secret is not set yet — skipping."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 240 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/automation/run"
